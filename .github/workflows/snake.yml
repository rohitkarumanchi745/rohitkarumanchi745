name: generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rohitkarumanchi745
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E9C46A&color_dots=#233528,#386641,#6A994E,#A7C957,#C9DE8B
            dist/snake-light.svg?color_snake=#BC6C25&color_dots=#EDEBDC,#A7C957,#6A994E,#386641,#344E41

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
