<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 70" role="img" aria-label="Research Interests — field notes from the grove">
  <title>Research Interests</title>
  <defs>
    <radialGradient id="paperI" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#FFFDEF"/>
      <stop offset="60%" stop-color="#FBF3D6"/>
      <stop offset="100%" stop-color="#F0E2B8"/>
    </radialGradient>
    <clipPath id="clipI"><rect x="9" y="9" width="842" height="52"/></clipPath>
    <path id="rayI" d="M430 35 L420 -80 L440 -80 Z"/>
  </defs>
  <rect x="0" y="0" width="860" height="70" fill="#E8D9A8"/>
  <rect x="4" y="4" width="852" height="62" fill="url(#paperI)"/>
  <g clip-path="url(#clipI)" fill="#E9C46A" opacity="0.13">
    <use xlink:href="#rayI"/>
    <use xlink:href="#rayI" transform="rotate(30 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(60 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(90 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(120 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(150 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(180 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(210 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(240 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(270 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(300 430 35)"/>
    <use xlink:href="#rayI" transform="rotate(330 430 35)"/>
    <animate attributeName="opacity" values="0.13;0.2;0.13" dur="8s" repeatCount="indefinite"/>
  </g>
  <g fill="#6F4E37" opacity="0.07">
    <circle cx="150" cy="20" r="1"/><circle cx="330" cy="58" r="1.1"/><circle cx="558" cy="16" r="0.9"/>
    <circle cx="712" cy="52" r="1"/><circle cx="80" cy="48" r="0.9"/><circle cx="790" cy="24" r="1"/>
  </g>
  <rect x="7" y="7" width="846" height="56" fill="none" stroke="#344E41" stroke-width="4.5"/>
  <rect x="13.5" y="13.5" width="833" height="43" fill="none" stroke="#BC6C25" stroke-width="1"/>
  <g fill="#386641">
    <circle cx="13.5" cy="13.5" r="2.4"/><circle cx="846.5" cy="13.5" r="2.4"/>
    <circle cx="13.5" cy="56.5" r="2.4"/><circle cx="846.5" cy="56.5" r="2.4"/>
  </g>
  <!-- flanking rules + diamonds -->
  <g stroke="#6F4E37" stroke-width="1.1" opacity="0.75">
    <line x1="42" y1="32" x2="190" y2="32"/>
    <line x1="670" y1="32" x2="818" y2="32"/>
  </g>
  <g fill="#BC6C25">
    <path d="M196 32 l4 -5.5 4 5.5 -4 5.5 Z"/>
    <path d="M656 32 l4 -5.5 4 5.5 -4 5.5 Z"/>
