      <path d="M3 -1 Q-6 -4 -7 -12 Q3 -12 5 -3 Z" fill="#6A994E" stroke="#386641" stroke-width="0.8"/>
      <path d="M6 -4 Q8 -14 17 -15 Q16 -5 8 -2 Z" fill="#8AB667" stroke="#386641" stroke-width="0.8"/>
    </g>
    <g transform="translate(641 32) scale(-1 1)">
      <path d="M0 8 Q2 -2 10 -8" fill="none" stroke="#386641" stroke-width="1.4"/>
      <path d="M3 -1 Q-6 -4 -7 -12 Q3 -12 5 -3 Z" fill="#6A994E" stroke="#386641" stroke-width="0.8"/>
