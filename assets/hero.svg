<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Rohit Karumanchi — AI/ML and backend engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182818"/>
      <stop offset="55%" stop-color="#24382B"/>
      <stop offset="100%" stop-color="#344E41"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0%" stop-color="#A7C957" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#A7C957" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A7C957" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pit" cx="0.38" cy="0.34" r="1">
      <stop offset="0%" stop-color="#D99A52"/>
      <stop offset="60%" stop-color="#BC6C25"/>
      <stop offset="100%" stop-color="#8F4F16"/>
    </radialGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9DE8B"/>
      <stop offset="100%" stop-color="#A7C957"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="860" height="300" fill="url(#bg)"/>
  <rect width="860" height="300" fill="url(#glow)"/>

  <!-- deco sunburst rays -->
  <g stroke="#E9C46A" stroke-width="1" opacity="0.16">
    <line x1="430" y1="118" x2="430" y2="18"/>
    <line x1="430" y1="118" x2="330" y2="26"/>
    <line x1="430" y1="118" x2="530" y2="26"/>
    <line x1="430" y1="118" x2="250" y2="48"/>
    <line x1="430" y1="118" x2="610" y2="48"/>
    <line x1="430" y1="118" x2="185" y2="82"/>
    <line x1="430" y1="118" x2="675" y2="82"/>
    <line x1="430" y1="118" x2="150" y2="118"/>
    <line x1="430" y1="118" x2="710" y2="118"/>
  </g>

  <!-- double deco frame -->
  <rect x="12" y="12" width="836" height="276" fill="none" stroke="#A7C957" stroke-width="1.5" opacity="0.8"/>
  <rect x="20" y="20" width="820" height="260" fill="none" stroke="#E9C46A" stroke-width="0.75" opacity="0.7"/>
  <!-- corner diamonds -->
  <g fill="#E9C46A">
    <path d="M 20 12 l 6 8 l -6 8 l -6 -8 z"/>
    <path d="M 840 12 l 6 8 l -6 8 l -6 -8 z"/>
    <path d="M 20 272 l 6 8 l -6 8 l -6 -8 z"/>
    <path d="M 840 272 l 6 8 l -6 8 l -6 -8 z"/>
  </g>

  <!-- avocado emblem -->
  <g transform="translate(430,86)">
    <circle r="46" fill="none" stroke="#E9C46A" stroke-width="1" opacity="0.85"/>
    <circle r="42" fill="none" stroke="#E9C46A" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="26" ry="34" fill="#386641"/>
    <ellipse cx="0" cy="0.5" rx="22" ry="30" fill="url(#flesh)"/>
    <ellipse cx="0" cy="1" rx="16.5" ry="24" fill="#FEFAE0"/>
    <circle cx="0" cy="7" r="10.5" fill="url(#pit)"/>
    <circle cx="-3.4" cy="3.4" r="3" fill="#EDBE8A" opacity="0.8"/>
    <path d="M 0 -34 q 6 -10 14 -12 q -2 10 -9 14 z" fill="#6A994E"/>
  </g>

  <!-- deco sparkles -->
  <g fill="#E9C46A">
    <path d="M 150 60 l 2.2 6 l 6 2.2 l -6 2.2 l -2.2 6 l -2.2 -6 l -6 -2.2 l 6 -2.2 z" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 706 52 l 1.8 5 l 5 1.8 l -5 1.8 l -1.8 5 l -1.8 -5 l -5 -1.8 l 5 -1.8 z" opacity="0.55">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="5.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 232 214 l 1.6 4.4 l 4.4 1.6 l -4.4 1.6 l -1.6 4.4 l -1.6 -4.4 l -4.4 -1.6 l 4.4 -1.6 z" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 640 226 l 1.6 4.4 l 4.4 1.6 l -4.4 1.6 l -1.6 4.4 l -1.6 -4.4 l -4.4 -1.6 l 4.4 -1.6 z" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- name -->
  <text x="430" y="188" font-family="Georgia,'Times New Roman',serif" font-size="38" letter-spacing="7" fill="#FEFAE0" text-anchor="middle">ROHIT KARUMANCHI</text>

  <!-- gold rules + subtitle -->
  <g stroke="#E9C46A" stroke-width="1" opacity="0.9">
    <line x1="235" y1="213" x2="335" y2="213"/>
    <line x1="525" y1="213" x2="625" y2="213"/>
  </g>
  <path d="M 430 206 l 5 7 l -5 7 l -5 -7 z" fill="#E9C46A"/>
  <text x="430" y="236" font-family="Georgia,'Times New Roman',serif" font-size="14" letter-spacing="5" fill="#E9C46A" text-anchor="middle">AI/ML &#183; BACKEND ENGINEER</text>

  <!-- tagline -->
  <text x="430" y="264" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" letter-spacing="1" fill="#A7C957" text-anchor="middle">models small enough to carry &#183; systems fast enough to disappear</text>
</svg>
