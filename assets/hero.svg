<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 320" role="img" aria-label="Karumanchi Groves vintage fruit-crate label: Rohit Karumanchi, finest avocados and fresh software">
  <title>Karumanchi Groves — Rohit Karumanchi</title>
  <defs>
    <radialGradient id="paperGrad" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#FFFDEF"/>
      <stop offset="55%" stop-color="#FBF3D6"/>
      <stop offset="100%" stop-color="#EEDFB4"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFDF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#6F4E37" stop-opacity="0"/>
      <stop offset="78%" stop-color="#6F4E37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6F4E37" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7A50"/>
      <stop offset="55%" stop-color="#386641"/>
      <stop offset="100%" stop-color="#2C4834"/>
    </linearGradient>
    <radialGradient id="fleshGrad" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#FBF2CE"/>
      <stop offset="45%" stop-color="#E4E5A2"/>
      <stop offset="80%" stop-color="#C0D279"/>
      <stop offset="100%" stop-color="#A7C957"/>
    </radialGradient>
    <radialGradient id="pitGrad" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#DA9A50"/>
      <stop offset="55%" stop-color="#BC6C25"/>
      <stop offset="100%" stop-color="#844716"/>
    </radialGradient>
    <radialGradient id="wholeGrad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#5B8A55"/>
      <stop offset="60%" stop-color="#386641"/>
      <stop offset="100%" stop-color="#27412F"/>
    </radialGradient>
    <radialGradient id="peachGrad" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#F9CD95"/>
      <stop offset="55%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#D97A42"/>
    </radialGradient>
    <linearGradient id="mangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D488"/>
      <stop offset="60%" stop-color="#E9C46A"/>
      <stop offset="100%" stop-color="#D89A3E"/>
    </linearGradient>
    <radialGradient id="tomatoGrad" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#F29A7C"/>
      <stop offset="60%" stop-color="#E76F51"/>
      <stop offset="100%" stop-color="#C0512F"/>
    </radialGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73A257"/>
      <stop offset="50%" stop-color="#6A994E"/>
      <stop offset="100%" stop-color="#527E3C"/>
    </linearGradient>
    <pattern id="engrave" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 4 L4 0" stroke="#6F4E37" stroke-width="0.35" opacity="0.5"/>
    </pattern>
    <clipPath id="frameClip"><rect x="29" y="29" width="802" height="262"/></clipPath>
    <path id="ray" d="M430 168 L415 -262 L445 -262 Z"/>
    <path id="arcTop" d="M 226 120 Q 430 58 634 120" fill="none"/>
  </defs>

  <!-- ===================== PAPER ===================== -->
  <rect x="0" y="0" width="860" height="320" fill="#E8D9A8"/>
  <rect x="6" y="6" width="848" height="308" fill="url(#paperGrad)"/>
  <rect x="6" y="6" width="848" height="308" fill="url(#engrave)" opacity="0.06"/>

  <!-- ===================== SUNBURST ===================== -->
  <g clip-path="url(#frameClip)">
    <g fill="#E9C46A" opacity="0.26">
      <animateTransform attributeName="transform" type="rotate" from="0 430 168" to="15 430 168" dur="60s" repeatCount="indefinite"/>
      <use xlink:href="#ray"/>
      <use xlink:href="#ray" transform="rotate(15 430 168)"/>
      <use xlink:href="#ray" transform="rotate(30 430 168)"/>
      <use xlink:href="#ray" transform="rotate(45 430 168)"/>
      <use xlink:href="#ray" transform="rotate(60 430 168)"/>
      <use xlink:href="#ray" transform="rotate(75 430 168)"/>
      <use xlink:href="#ray" transform="rotate(90 430 168)"/>
      <use xlink:href="#ray" transform="rotate(105 430 168)"/>
      <use xlink:href="#ray" transform="rotate(120 430 168)"/>
      <use xlink:href="#ray" transform="rotate(135 430 168)"/>
      <use xlink:href="#ray" transform="rotate(150 430 168)"/>
      <use xlink:href="#ray" transform="rotate(165 430 168)"/>
      <use xlink:href="#ray" transform="rotate(180 430 168)"/>
      <use xlink:href="#ray" transform="rotate(195 430 168)"/>
      <use xlink:href="#ray" transform="rotate(210 430 168)"/>
      <use xlink:href="#ray" transform="rotate(225 430 168)"/>
      <use xlink:href="#ray" transform="rotate(240 430 168)"/>
      <use xlink:href="#ray" transform="rotate(255 430 168)"/>
      <use xlink:href="#ray" transform="rotate(270 430 168)"/>
      <use xlink:href="#ray" transform="rotate(285 430 168)"/>
      <use xlink:href="#ray" transform="rotate(300 430 168)"/>
      <use xlink:href="#ray" transform="rotate(315 430 168)"/>
      <use xlink:href="#ray" transform="rotate(330 430 168)"/>
      <use xlink:href="#ray" transform="rotate(345 430 168)"/>
    </g>
    <ellipse cx="430" cy="172" rx="290" ry="120" fill="url(#glowGrad)"/>
  </g>

  <!-- paper speckle & scuff -->
  <g fill="#6F4E37" opacity="0.08">
    <circle cx="110" cy="60" r="1.2"/><circle cx="315" cy="44" r="0.9"/><circle cx="552" cy="52" r="1.3"/>
    <circle cx="700" cy="80" r="1.0"/><circle cx="806" cy="140" r="1.2"/><circle cx="62" cy="176" r="1.1"/>
    <circle cx="212" cy="278" r="1.0"/><circle cx="470" cy="296" r="1.2"/><circle cx="628" cy="270" r="0.9"/>
    <circle cx="778" cy="60" r="0.9"/><circle cx="360" cy="285" r="1.0"/><circle cx="180" cy="52" r="0.8"/>
    <circle cx="512" cy="70" r="0.8"/><circle cx="86" cy="110" r="0.9"/><circle cx="746" cy="284" r="1.1"/>
  </g>
  <g stroke="#6F4E37" opacity="0.05" stroke-width="0.8" fill="none">
    <path d="M120 250 q60 -4 130 2"/><path d="M560 60 q50 5 104 -2"/><path d="M640 246 q44 6 96 0"/>
  </g>

  <!-- ===================== ORNATE FRAME ===================== -->
  <rect x="10" y="10" width="840" height="300" fill="none" stroke="#344E41" stroke-width="9"/>
  <rect x="20.5" y="20.5" width="819" height="279" fill="none" stroke="#BC6C25" stroke-width="1.4"/>
  <rect x="26" y="26" width="808" height="268" fill="none" stroke="#386641" stroke-width="2.4"/>
  <!-- corner rosettes -->
  <g>
    <g transform="translate(26 26)"><circle r="7.5" fill="#FEFAE0" stroke="#386641" stroke-width="2"/><circle r="2.6" fill="#BC6C25"/></g>
    <g transform="translate(834 26)"><circle r="7.5" fill="#FEFAE0" stroke="#386641" stroke-width="2"/><circle r="2.6" fill="#BC6C25"/></g>
    <g transform="translate(26 294)"><circle r="7.5" fill="#FEFAE0" stroke="#386641" stroke-width="2"/><circle r="2.6" fill="#BC6C25"/></g>
    <g transform="translate(834 294)"><circle r="7.5" fill="#FEFAE0" stroke="#386641" stroke-width="2"/><circle r="2.6" fill="#BC6C25"/></g>
  </g>

  <!-- ===================== ARCHED BRAND ===================== -->
  <text font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="bold" fill="#6F4E37" letter-spacing="6">
    <textPath xlink:href="#arcTop" startOffset="50%" text-anchor="middle">KARUMANCHI&#160;GROVES</textPath>
  </text>
  <g fill="#BC6C25">
    <path d="M213 116 l4.5 -7 4.5 7 -4.5 7 Z"/>
    <path d="M638 116 l4.5 -7 4.5 7 -4.5 7 Z"/>
  </g>

  <!-- ===================== NAME ===================== -->
  <g font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="40" letter-spacing="1.5" text-anchor="middle">
    <text x="432.2" y="198.2" fill="#BC6C25" opacity="0.85">ROHIT KARUMANCHI</text>
    <text x="430" y="196" fill="#344E41">ROHIT KARUMANCHI</text>
  </g>

  <!-- ===================== RIBBON ===================== -->
  <g>
    <!-- tails -->
    <path d="M206 224 L246 224 L246 254 L206 254 L220 239 Z" fill="#386641"/>
    <path d="M654 224 L614 224 L614 254 L654 254 L640 239 Z" fill="#386641"/>
    <!-- folds -->
    <path d="M240 246 L240 256 L252 246 Z" fill="#27412F"/>
    <path d="M620 246 L620 256 L608 246 Z" fill="#27412F"/>
    <!-- band -->
    <path d="M240 214 L620 214 L620 246 L240 246 Z" fill="url(#ribbonGrad)" stroke="#2E5233" stroke-width="1.2"/>
    <text x="430" y="235" font-family="Georgia,'Times New Roman',serif" font-size="13.5" font-weight="bold" letter-spacing="1.2" fill="#FEFAE0" text-anchor="middle">FINEST AVOCADOS &amp; FRESH SOFTWARE</text>
  </g>

  <!-- ===================== TAGLINE ===================== -->
  <text x="430" y="270" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="bold" letter-spacing="3" fill="#6F4E37" text-anchor="middle">AI/ML &amp; BACKEND ENGINEER</text>
  <text x="430" y="285" font-family="Georgia,'Times New Roman',serif" font-size="10.5" letter-spacing="0.8" fill="#6F4E37" text-anchor="middle">MODELS SMALL ENOUGH TO CARRY &#183; SYSTEMS FAST ENOUGH TO DISAPPEAR</text>

  <!-- ===================== LEFT: ENGRAVED AVOCADO HALF ===================== -->
  <g transform="translate(15 34) scale(0.82)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="7s" repeatCount="indefinite"/>
    <!-- leaves -->
    <g>
      <path d="M116 132 Q88 96 118 84 Q136 106 122 132 Z" fill="#6A994E" stroke="#386641" stroke-width="1.2"/>
      <path d="M117 128 Q106 106 116 90" fill="none" stroke="#386641" stroke-width="1" opacity="0.7"/>
      <path d="M126 130 Q152 102 176 116 Q166 140 130 136 Z" fill="#8AB667" stroke="#386641" stroke-width="1.2"/>
      <path d="M130 132 Q150 118 168 118" fill="none" stroke="#386641" stroke-width="1" opacity="0.7"/>
    </g>
    <!-- stem -->
    <path d="M119 126 Q120 118 124 112" fill="none" stroke="#6F4E37" stroke-width="3.4" stroke-linecap="round"/>
    <!-- shadow -->
    <ellipse cx="122" cy="254" rx="44" ry="7" fill="#6F4E37" opacity="0.18"/>
    <!-- skin -->
    <path d="M120 126 C158 128 168 168 166 196 C164 230 146 252 120 252 C94 252 76 230 74 196 C72 168 82 128 120 126 Z" fill="url(#skinGrad)"/>
    <!-- flesh -->
    <path d="M120 134 C152 136 160 172 158 196 C156 226 141 244 120 244 C99 244 84 226 82 196 C80 172 88 136 120 134 Z" fill="url(#fleshGrad)"/>
    <!-- engraving rings on flesh -->
    <g fill="none" stroke="#6F4E37" opacity="0.16">
      <path d="M120 142 C147 144 154 175 152 196 C150 221 137 237 120 237 C103 237 90 221 88 196 C86 175 93 144 120 142Z" stroke-width="0.9"/>
      <path d="M120 152 C141 154 147 179 145 196 C143 216 133 229 120 229 C107 229 97 216 95 196 C93 179 99 154 120 152Z" stroke-width="0.8"/>
    </g>
    <!-- pit -->
    <circle cx="120" cy="196" r="23" fill="url(#pitGrad)"/>
    <circle cx="120" cy="196" r="23" fill="none" stroke="#6F4E37" stroke-width="1" opacity="0.5"/>
    <ellipse cx="112" cy="187" rx="8" ry="6" fill="#FEFAE0" opacity="0.45"/>
    <!-- skin highlight -->
    <path d="M88 156 Q82 182 86 206" fill="none" stroke="#A7C957" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  </g>
  </g>

  <!-- ===================== RIGHT: FRUIT STILL LIFE ===================== -->
  <g transform="translate(140 40) scale(0.82)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="7s" begin="-3.5s" repeatCount="indefinite"/>
    <ellipse cx="738" cy="252" rx="62" ry="8" fill="#6F4E37" opacity="0.18"/>
    <!-- whole avocado, pear silhouette -->
    <g transform="rotate(-12 742 170)">
      <path d="M742 112 C750 112 756 122 757 136 C759 158 770 170 770 192 C770 216 757 232 742 232 C727 232 714 216 714 192 C714 170 725 158 727 136 C728 122 734 112 742 112 Z" fill="url(#wholeGrad)"/>
      <path d="M726 150 Q719 178 724 206" fill="none" stroke="#A7C957" stroke-width="3.4" opacity="0.45" stroke-linecap="round"/>
      <g fill="#A7C957" opacity="0.3">
        <circle cx="748" cy="140" r="1.1"/><circle cx="756" cy="168" r="1.1"/><circle cx="742" cy="188" r="1.2"/>
        <circle cx="754" cy="206" r="1.0"/><circle cx="734" cy="216" r="1.1"/><circle cx="738" cy="158" r="0.9"/>
      </g>
      <path d="M742 112 Q742 104 746 100" fill="none" stroke="#6F4E37" stroke-width="3" stroke-linecap="round"/>
      <path d="M746 100 Q756 98 760 104 Q752 110 746 106 Z" fill="#6A994E" stroke="#386641" stroke-width="0.8"/>
    </g>
    <!-- mango behind right -->
    <g transform="rotate(18 776 228)">
      <ellipse cx="776" cy="228" rx="28" ry="20" fill="url(#mangoGrad)" stroke="#B8802E" stroke-width="1"/>
      <path d="M756 218 Q770 210 788 216" fill="none" stroke="#FEFAE0" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    </g>
    <!-- peach front left -->
    <g>
      <circle cx="700" cy="228" r="23" fill="url(#peachGrad)" stroke="#C0512F" stroke-width="1"/>
      <path d="M700 206 Q706 218 700 250" fill="none" stroke="#C0512F" stroke-width="1" opacity="0.55"/>
      <path d="M698 207 Q692 200 684 200 Q688 210 696 210 Z" fill="#6A994E" stroke="#386641" stroke-width="0.8"/>
    </g>
    <!-- small tomato accent -->
    <circle cx="737" cy="240" r="12" fill="url(#tomatoGrad)" stroke="#A8432A" stroke-width="0.8"/>
    <path d="M735 229 q2 -5 6 -6 q0 5 -4 7 Z" fill="#6A994E"/>
  </g>
  </g>

  <!-- ===================== MEDALLIONS ===================== -->
  <g text-anchor="middle" font-family="Georgia,'Times New Roman',serif">
    <g>
      <circle cx="70" cy="264" r="19" fill="#386641"/>
      <circle cx="70" cy="264" r="15.5" fill="none" stroke="#FEFAE0" stroke-width="1"/>
      <text x="70" y="259.5" font-size="6" letter-spacing="1" fill="#FEFAE0">GRADE</text>
      <text x="70" y="275" font-size="14" font-weight="bold" fill="#E9C46A">A</text>
    </g>
    <g>
      <circle cx="790" cy="264" r="20" fill="#386641"/>
      <circle cx="790" cy="264" r="16.5" fill="none" stroke="#FEFAE0" stroke-width="1"/>
      <text x="790" y="257.5" font-size="5.5" letter-spacing="0.7" fill="#FEFAE0">NET WT</text>
      <text x="790" y="268.5" font-size="9" font-weight="bold" fill="#E9C46A">1.58</text>
      <text x="790" y="277" font-size="5.5" letter-spacing="0.7" fill="#FEFAE0">BITS</text>
    </g>
  </g>

  <!-- twinkles -->
  <g fill="#E9C46A">
    <path d="M212 148 l2.2 -6 2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 Z" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M646 142 l2 -5.4 2 5.4 5.4 2 -5.4 2 -2 5.4 -2 -5.4 -5.4 -2 Z" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5.5s" begin="-2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- vignette -->
  <rect x="6" y="6" width="848" height="308" fill="url(#vignette)"/>
</svg>
