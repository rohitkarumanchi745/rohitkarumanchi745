<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 70" role="img" aria-label="Ripening — currently in progress">
  <title>Ripening — currently in progress</title>
  <defs>
    <radialGradient id="paperR" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#FFFDEF"/>
      <stop offset="60%" stop-color="#FBF3D6"/>
      <stop offset="100%" stop-color="#F0E2B8"/>
    </radialGradient>
    <clipPath id="clipR"><rect x="9" y="9" width="842" height="52"/></clipPath>
    <path id="rayR" d="M430 35 L420 -80 L440 -80 Z"/>
  </defs>
  <rect x="0" y="0" width="860" height="70" fill="#E8D9A8"/>
  <rect x="4" y="4" width="852" height="62" fill="url(#paperR)"/>
  <g clip-path="url(#clipR)" fill="#E9C46A" opacity="0.13">
    <use xlink:href="#rayR"/>
    <use xlink:href="#rayR" transform="rotate(30 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(60 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(90 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(120 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(150 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(180 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(210 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(240 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(270 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(300 430 35)"/>
    <use xlink:href="#rayR" transform="rotate(330 430 35)"/>
    <animate attributeName="opacity" values="0.13;0.2;0.13" dur="8s" repeatCount="indefinite"/>
  </g>
  <g fill="#6F4E37" opacity="0.07">
    <circle cx="140" cy="24" r="1"/><circle cx="340" cy="56" r="1.1"/><circle cx="540" cy="16" r="0.9"/>
    <circle cx="700" cy="50" r="1"/><circle cx="104" cy="46" r="0.9"/><circle cx="800" cy="28" r="1"/>
  </g>
  <rect x="7" y="7" width="846" height="56" fill="none" stroke="#344E41" stroke-width="4.5"/>
  <rect x="13.5" y="13.5" width="833" height="43" fill="none" stroke="#BC6C25" stroke-width="1"/>
  <g fill="#386641">
    <circle cx="13.5" cy="13.5" r="2.4"/><circle cx="846.5" cy="13.5" r="2.4"/>
    <circle cx="13.5" cy="56.5" r="2.4"/><circle cx="846.5" cy="56.5" r="2.4"/>
  </g>
  <!-- flanking rules + diamonds -->
  <g stroke="#6F4E37" stroke-width="1.1" opacity="0.75">
    <line x1="42" y1="32" x2="290" y2="32"/>
    <line x1="570" y1="32" x2="818" y2="32"/>
  </g>
  <g fill="#BC6C25">
    <path d="M296 32 l4 -5.5 4 5.5 -4 5.5 Z"/>
    <path d="M556 32 l4 -5.5 4 5.5 -4 5.5 Z"/>
  </g>
  <!-- ripeness scale: hard, almost, ripe -->
  <g stroke="#344E41" stroke-width="0.8">
    <g transform="translate(322 32)">
      <circle cx="-11" cy="0" r="4.6" fill="#A7C957"/>
      <circle cx="0" cy="0" r="4.6" fill="#6A994E"/>
      <circle cx="11" cy="0" r="4.6" fill="#386641">
        <animate attributeName="fill" values="#386641;#2C4834;#386641" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(538 32)">
      <circle cx="-11" cy="0" r="4.6" fill="#386641">
        <animate attributeName="fill" values="#386641;#2C4834;#386641" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="4.6" fill="#6A994E"/>
      <circle cx="11" cy="0" r="4.6" fill="#A7C957"/>
    </g>
  </g>
  <text x="430" y="38" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="bold" letter-spacing="5" fill="#344E41" text-anchor="middle">RIPENING</text>
  <text x="430" y="54" font-family="Georgia,'Times New Roman',serif" font-size="10.5" font-style="italic" fill="#6F4E37" text-anchor="middle">currently in progress</text>
</svg>
